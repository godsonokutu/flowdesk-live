x-flowdesk-invariants:
- available_stock_never_negative
- one_unit_has_at_most_one_active_reservation_owner
- provider_callbacks_and_ingress_are_idempotent
- late_payment_never_silently_resurrects_expired_stock
- privileged_override_requires_actor_reason_and_immutable_audit_event
- server_time_is_authoritative_for_expiry
- provider_retries_never_duplicate_reservations_or_orders
- Lifecycle stock-release work is inserted before the same commit that makes inventory
  available.
- Dead-letter replay never changes the original payload/source identity and requires
  authorization plus an audit reason.
- SKIP LOCKED is allowed for independent outbox jobs, never for strict-FIFO buyer
  selection.
- Variant switching releases source inventory only in the same transaction that successfully
  claims destination inventory; failure preserves the original reservation.
x-flowdesk-c09-stock-freshness:
  max-snapshot-age-ms: 15000
  max-server-ack-age-ms: 10000
  reconnect-policy: Reconnect increments connection generation and invalidates all
    pre-reconnect stock snapshots.
  mutation-policy: Stock-affecting seller actions carry If-Inventory-Version from
    a fresh scoped snapshot; server must still recheck authoritative inventory transactionally.
  offline-policy: Offline or disconnected clients may display last-known stock only
    as stale and must not promise availability.
  server-enforcement: Seller stock mutations reject missing version with 428 and stale
    version with 409 after locking the inventory row; no reservation or audit side
    effect may occur on failure.
x-flowdesk-c11-variant-switch:
  lock-order: reservation row first; source + destination inventory rows ordered by
    inventory id
  failure-policy: rollback all source/destination/reservation changes and preserve
    original hold
  success-policy: same reservation identity moves to destination; source release emits
    durable inventory_available/variant_switch outbox work
  waitlist-policy: released source stock is handled by the existing strict-FIFO lifecycle
    worker
x-flowdesk-c12-session-shutdown:
  cutover: live -> closing is the authoritative boundary; operations requiring a live
    session fail after the cut-over commit
  waitlist_policy: all waiting entries are cancelled at cut-over; lifecycle workers
    treat closing/ended sessions as non-live and never promote
  hold_policy: existing active/payment-pending reservations keep their original server-authoritative
    expiry and may settle valid payment before expiry
  finalization: closing -> ended only after zero active/payment-pending holds and
    zero waiting entries; due holds release reserved inventory transactionally
  lock_order: finalization locks active reservation rows ordered by id, then the session
    row, then inventory rows ordered by id
  audit: shutdown_started and ended transitions record operator identity, reason,
    counts and lifecycle policy
